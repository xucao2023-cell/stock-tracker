name: Update daily stock prices

# Pulls closing prices for the 25 stocks tracked in data.json from free public
# APIs (Tencent for A-share / HK / US, Yahoo for EU) and pushes the updated
# data.json back to main. Frontend auto-syncs via jsDelivr CDN (no HTML change).

on:
  schedule:
    # 1) Asian close: A-share 15:35 CST (UTC+8) + HK/US same batch.
    #    Local time:
    #      - 15:35 China (CST, UTC+8, no DST)
    #      - 09:35 Europe (CET = UTC+1 winter, CEST = UTC+2 summer)
    #    Cron in UTC: 07:35.
    - cron: '35 7 * * 1-5'
    # 2) European/US close: US 16:00 ET + EU 17:30 CET all wrapped up.
    #    Local time:
    #      - 22:30 Europe (CEST summer / CET winter — fixed 22:30 local)
    #      - 16:30 US East (EDT summer / EST winter)
    #    Cron in UTC: 20:30. In CET winter this fires at 21:30 UTC = 22:30 CET
    #    (still post-EU-close, ~5h after US close); in CEST summer it fires at
    #    20:30 UTC = 22:30 CEST (post-EU-close by 5h, US close by 30min).
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install iconv-lite
        working-directory: scripts
        run: npm install --omit=dev

      - name: Update prices
        run: node scripts/update_prices.mjs
